# Nginx Configuration for Obsidian MROP
# Implements API Gateway pattern with load balancing and caching

upstream obsidian_backend {
    # Load balancing between multiple Obsidian API instances
    server localhost:5000 weight=3;
    server localhost:5001 weight=2;
    server localhost:5002 weight=1;

    # Health check
    keepalive 32;
}

upstream orders_service {
    # Load balancing for orders microservice instances
    server localhost:4001;
    server localhost:4002;
    server localhost:4003;

    keepalive 16;
}

upstream booking_service {
    server localhost:4004;
    server localhost:4005;
    keepalive 16;
}

upstream payment_service {
    server localhost:4006;
    server localhost:4007;
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=obsidian_api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=orders_service:10m rate=1000r/s;
limit_req_zone $binary_remote_addr zone=booking_service:10m rate=500r/s;
limit_req_zone $binary_remote_addr zone=payment_service:10m rate=200r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name obsidian.local;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Frontend (React app)
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Rate limiting for frontend
        limit_req zone=obsidian_api burst=20 nodelay;
        limit_conn conn_limit 100;
    }

    # API Gateway - Main entry point for all microservice requests
    location /api/gateway/ {
        proxy_pass http://obsidian_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API rate limiting
        limit_req zone=obsidian_api burst=50 nodelay;
        limit_conn conn_limit 200;

        # Caching for GET requests
        proxy_cache gateway_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout invalid_header updating;

        # Cache bypass for non-GET requests
        proxy_cache_methods GET HEAD;
    }

    # Direct microservice access (for debugging/admin purposes)
    location /api/services/orders/ {
        proxy_pass http://orders_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Service-specific rate limiting
        limit_req zone=orders_service burst=100 nodelay;
        limit_conn conn_limit 50;
    }

    location /api/services/booking/ {
        proxy_pass http://booking_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        limit_req zone=booking_service burst=50 nodelay;
        limit_conn conn_limit 30;
    }

    location /api/services/payment/ {
        proxy_pass http://payment_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Stricter rate limiting for payments
        limit_req zone=payment_service burst=20 nodelay;
        limit_conn conn_limit 20;
    }

    # Obsidian API management endpoints
    location /api/ {
        proxy_pass http://obsidian_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Management API rate limiting (stricter)
        limit_req zone=obsidian_api burst=10 nodelay;
        limit_conn conn_limit 50;
    }

    # Health checks (no rate limiting)
    location /health {
        proxy_pass http://obsidian_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
}

# Cache configuration
proxy_cache_path /var/cache/nginx/gateway_cache levels=1:2 keys_zone=gateway_cache:10m max_size=1g
                 inactive=10m use_temp_path=off;

# Log format with timing and cache status
log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" $request_time $upstream_response_time '
                     '$proxy_cache_status';

access_log /var/log/nginx/obsidian_access.log detailed;
error_log /var/log/nginx/obsidian_error.log warn;
